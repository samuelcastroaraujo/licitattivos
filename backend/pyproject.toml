[project]
name = "licitattivos-backend"
version = "0.1.0"
description = "Sistema multi-agente de automação de licitações — Attivos Magisttrais"
requires-python = ">=3.12"

dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Banco de dados
    "supabase>=2.5.0",
    # Agentes e LLM
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    # PDF
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.13",
    # Documentos
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "weasyprint>=62.0",
    "jinja2>=3.1.0",
    # Scraping
    "playwright>=1.40",
    "apscheduler>=3.10.0",
    # Utilitários
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "sentry-sdk>=2.59.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]



[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest-mock>=3.15.1",
]
